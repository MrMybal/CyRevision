<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect width="1280" height="760" fill="#111820"/>
<text x="48" y="48" fill="#F29A43" font-family="sans-serif" font-size="18" font-weight="700">CYREVISION / USER GUIDE</text>
<text x="48" y="110" fill="#F2F5F7" font-family="sans-serif" font-size="34" font-weight="700">Agent permissions are separate choices</text>
<rect x="48" y="220" width="568" height="140" rx="14" fill="#1F2B36" stroke="#415467" stroke-width="2"/>
<text x="70" y="253" fill="#F29A43" font-family="sans-serif" font-size="19" font-weight="700">01</text>
<text x="120" y="259" fill="#FFFFFF" font-family="sans-serif" font-size="25" font-weight="700">Select provider</text>
<text x="70" y="308" fill="#CAD8E2" font-family="sans-serif" font-size="23" font-weight="400">CLI, API or local model</text>
<rect x="664" y="220" width="568" height="140" rx="14" fill="#1F2B36" stroke="#415467" stroke-width="2"/>
<text x="686" y="253" fill="#F29A43" font-family="sans-serif" font-size="19" font-weight="700">02</text>
<text x="736" y="259" fill="#FFFFFF" font-family="sans-serif" font-size="25" font-weight="700">Choose context</text>
<text x="686" y="308" fill="#CAD8E2" font-family="sans-serif" font-size="23" font-weight="400">Project, files and instructions</text>
<rect x="48" y="390" width="568" height="140" rx="14" fill="#1F2B36" stroke="#415467" stroke-width="2"/>
<text x="70" y="423" fill="#F29A43" font-family="sans-serif" font-size="19" font-weight="700">03</text>
<text x="120" y="429" fill="#FFFFFF" font-family="sans-serif" font-size="25" font-weight="700">Grant capabilities</text>
<text x="70" y="478" fill="#CAD8E2" font-family="sans-serif" font-size="23" font-weight="400">Read, edit, network, stage</text>
<rect x="664" y="390" width="568" height="140" rx="14" fill="#1F2B36" stroke="#415467" stroke-width="2"/>
<text x="686" y="423" fill="#F29A43" font-family="sans-serif" font-size="19" font-weight="700">04</text>
<text x="736" y="429" fill="#FFFFFF" font-family="sans-serif" font-size="25" font-weight="700">Review results</text>
<text x="686" y="478" fill="#CAD8E2" font-family="sans-serif" font-size="23" font-weight="400">Diff, tests and explicit commit</text>
<text x="48" y="633" fill="#AAC8C5" font-family="sans-serif" font-size="23" font-weight="400">MCP adds another permission boundary. A completed agent turn is not an approved diff.</text>
<text x="48" y="724" fill="#91A3B1" font-family="sans-serif" font-size="16" font-weight="400">EN / FR · Concept diagram — not a live status</text>
