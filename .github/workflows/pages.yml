name: Publish showcase and user guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .CyDocBuild/package-lock.json
      - name: Install locked documentation tools
        run: npm ci --prefix .CyDocBuild --no-audit --no-fund
      - name: Build and test the static site
        run: |
          node .CyDocBuild/build.mjs --check
          node --test .CyDocBuild/test/*.test.mjs
          node website/build.mjs
          node --disallow-code-generation-from-strings --frozen-intrinsics --test website/test/*.test.mjs
          node website/build.mjs --check
      - name: Validate publication inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-repository-privacy.py --ref HEAD
          scanner_dir="$(mktemp -d)"
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$scanner_dir/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o "$scanner_dir/checksums.txt"
          (cd "$scanner_dir" && grep "  $archive$" checksums.txt | sha256sum --check --strict - && tar -xzf "$archive" gitleaks)
          if ! "$scanner_dir/gitleaks" git . --log-opts="--all --full-history --root -m" --redact --ignore-gitleaks-allow --no-banner > "$scanner_dir/source-result.txt" 2>&1; then
            echo 'Source validation failed; publication stopped.' >&2
            exit 1
          fi
          if ! "$scanner_dir/gitleaks" dir dist/website --config .gitleaks.toml --redact --ignore-gitleaks-allow --no-banner > "$scanner_dir/site-result.txt" 2>&1; then
            echo 'Artifact validation failed; publication stopped.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location('validation', 'scripts/check-repository-privacy.py')
          validation = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validation)
          for file in pathlib.Path('dist/website').rglob('*'):
              if file.is_file() and validation.inspect(file.as_posix(), file.read_bytes()):
                  raise SystemExit('Artifact validation failed; publication stopped.')
          PY
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload generated site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/website

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
