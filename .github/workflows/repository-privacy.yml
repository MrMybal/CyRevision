name: Repository privacy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check local files, paths and commit identities
        run: python3 scripts/check-repository-privacy.py
      - name: Scan history for credentials
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          scanner_dir="$(mktemp -d)"
          cd "$scanner_dir"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" git . --log-opts="--all --full-history --root -m" --redact --ignore-gitleaks-allow --no-banner
